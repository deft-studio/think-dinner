# 商品の`.github/workflows/claude-review.yml`の型（PRにClaudeのレビューを自動で付ける）。
# - 使う前に、リポジトリにClaudeのGitHubアプリ（https://github.com/apps/claude）を入れ、
#   Secretsに CLAUDE_CODE_OAUTH_TOKEN（手元で`claude setup-token`を実行して作る。Pro・Maxの契約で使える）を入れる
# - 商品ごとに書き換える所は無い。そのまま置いてよい
name: Claudeのレビュー

# PRを作った時（下書きを除く）と、PRのコメントに「@claude」と書いた時だけ動く。
# pushのたびに動かさないのは、Claudeの契約の使用量（普段のClaude Codeと同じ枠）を抑えるため。直した後に見直してほしい時は、PRに「@claude」と書く。
# 使用量を抑えるため、モデルはSonnet、やり取りは10回まで、使える道具は差分を読むこととコメントすることだけにする（コードは書き換えさせない）。
# @claude で動かせるのは、リポジトリのメンバーだけにする。フォークからのPRとDependabotのPRは、鍵が渡らないので動かさない
on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      # コメントで動いた時も、PRの中身（mainではなく）を読むため、PRの最新を取り出す
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            このPRをレビューし、日本語でコメントしてください。PRのブランチは、作業フォルダに取り出してあります。
            はじめに AGENTS.md を読み、このリポジトリの決まりと「いつ何を直すか」の表を確かめてください。

            見ること（これ以外の、好みや書き方の指摘はしない）：
            - 正しさ：不具合・セキュリティの穴・エラーの握りつぶし
            - 要件：PRの本文の完了条件を満たしているか
            - 資料とコードの食い違い：AGENTS.md の「いつ何を直すか」に沿って、直すべき資料が直されているか

            問題が無ければ、「問題なし」とだけ短くコメントしてください。
            全体のまとめは `gh pr comment` で、コードの行への指摘は `mcp__github_inline_comment__create_inline_comment`（`confirmed: true`）で書いてください。
            コメント以外の形で返事をしないでください。
          claude_args: |
            --model sonnet
            --max-turns 10
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
